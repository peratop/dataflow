[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataflow"
version = "0.1.0"
description = "Biblioteca extensivel para construcao e execucao de pipelines de processamento de dados."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Leonardo Pereira" },
    { name = "Eduardo Erthal" },
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
